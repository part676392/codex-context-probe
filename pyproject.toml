[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-context-probe"
version = "0.1.0"
description = "Deterministic preflight for Codex-powered pull request instruction context"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Tomohiro Taguchi", email = "part676392@gmail.com" },
]
keywords = ["codex", "agents-md", "AGENTS.md", "openai", "ai-coding", "context", "github-actions", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "toml>=0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
codex-context-probe = "codex_context_probe.cli:main"

[project.urls]
Homepage = "https://github.com/part676392/codex-context-probe"
Repository = "https://github.com/part676392/codex-context-probe"
Issues = "https://github.com/part676392/codex-context-probe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_context_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
